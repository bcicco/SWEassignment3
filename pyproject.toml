[project]
name = "swe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ben-matilda", email = "ben@matildamigration.com" }
]
requires-python = "==3.11.*"
dependencies = [
    "boto3>=1.43.114",
    "pydantic",
]

[project.scripts]
swe = "swe:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
api = [
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
]
dev = [
    "httpx2>=2.13.1",
    "moto>=5.2.4",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

# installed by `uv sync` and `uv run`, but left out of the Lambda bundle (see infra/package.py)
[tool.uv]
default-groups = ["api", "dev"]

# coding standard: PEP 8, enforced by Ruff (`uv run ruff check` and `uv run ruff format`)
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle: PEP 8 layout and whitespace
    "F",      # pyflakes: unused imports and variables, undefined names
    "I",      # isort: import order
    "N",      # pep8-naming: PEP 8 naming conventions
    "UP",     # pyupgrade: modern syntax for the pinned Python version
    "B",      # flake8-bugbear: likely bugs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # package __init__ files re-export names
