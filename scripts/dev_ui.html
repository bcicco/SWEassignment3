<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>YOWD dev UI</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; background: #f4f4f5; color: #18181b; }
  header { background: #18181b; color: #fff; padding: 10px 20px; display: flex; gap: 20px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; }
  header label { color: #d4d4d8; }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 20px; }
  section, .card { background: #fff; border: 1px solid #e4e4e7; border-radius: 8px; padding: 14px; }
  .card { margin-bottom: 14px; }
  h2 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: #52525b; margin-top: 6px; }
  input, select { width: 100%; box-sizing: border-box; padding: 5px; font: inherit; }
  header input { width: 110px; }
  button { margin: 8px 6px 0 0; padding: 5px 10px; cursor: pointer; font: inherit; }
  .row { display: flex; gap: 6px; } .row > * { flex: 1; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; background: #e4e4e7; }
  .open, .pending { background: #dbeafe; } .accepted { background: #dcfce7; }
  .cancelled, .rejected { background: #fee2e2; } .superseded, .revision_requested { background: #fef9c3; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  td, th { text-align: left; padding: 3px 6px; border-bottom: 1px solid #f4f4f5; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; color: #71717a; }
  #error { position: fixed; bottom: 20px; right: 20px; background: #dc2626; color: #fff; padding: 10px 14px; border-radius: 6px; display: none; max-width: 480px; }
</style>
</head>
<body>
<header>
  <h1>YOWD dev UI</h1>
  <label>customer id <input id="customer" value="cust-1"></label>
  <label>staff id <input id="staff" value="staff-1"></label>
  <button onclick="refresh()">Refresh</button>
</header>
<main>
  <section>
    <h2>Log request</h2>
    <label><input type="checkbox" id="anonymous" style="width:auto"> anonymous (logged by staff)</label>
    <label>contact name</label><input id="contact_name" value="Sam">
    <label>contact phone</label><input id="contact_phone" value="0400000000">
    <div class="row">
      <div><label>parcel size</label><select id="size"><option>small</option><option>medium</option><option>large</option></select></div>
      <div><label>weight kg</label><input id="weight" value="2.5"></div>
      <div><label>qty</label><input id="quantity" value="1"></div>
    </div>
    <label>pickup (street, suburb, postcode)</label>
    <div class="row"><input id="p_street" value="1 A St"><input id="p_suburb" value="Hawthorn"><input id="p_postcode" value="3122"></div>
    <label>dropoff (street, suburb, postcode)</label>
    <div class="row"><input id="d_street" value="2 B St"><input id="d_suburb" value="Kew"><input id="d_postcode" value="3101"></div>
    <button onclick="logRequest()">Log request</button>
  </section>
  <div id="requests"></div>
</main>
<div id="error"></div>
<script>
const $ = id => document.getElementById(id);
const badge = s => `<span class="badge ${s}">${s}</span>`;
const time = t => t ? new Date(t).toLocaleString() : "";
const hoursFromNow = h => new Date(Date.now() + h * 3600e3).toISOString();

async function call(command, body) {
  const res = await fetch(`/api/${command}`, { method: "POST", body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) {
    $("error").textContent = `${res.status} ${data.error}`;
    $("error").style.display = "block";
    setTimeout(() => $("error").style.display = "none", 6000);
  }
  await refresh();
}

function logRequest() {
  const anonymous = $("anonymous").checked;
  call("log_request", {
    customer_id: anonymous ? null : $("customer").value,
    logged_by: anonymous ? $("staff").value : null,
    contact_name: $("contact_name").value,
    contact_phone: $("contact_phone").value,
    parcels: [{ size: $("size").value, weight_kg: $("weight").value, quantity: Number($("quantity").value) }],
    pickup_address: { street: $("p_street").value, suburb: $("p_suburb").value, postcode: $("p_postcode").value },
    dropoff_address: { street: $("d_street").value, suburb: $("d_suburb").value, postcode: $("d_postcode").value },
  });
}

function issueQuote(request_id) {
  call("issue_quote", {
    request_id, staff_id: $("staff").value, price: $(`price-${request_id}`).value,
    eta_pickup: [hoursFromNow(1), hoursFromNow(3)], eta_dropoff: [hoursFromNow(4), hoursFromNow(6)],
  });
}

const respond = (command, request_id, quote_id) => call(command, { request_id, quote_id, customer_id: $("customer").value });

function render({ request: r, quotes, events }) {
  const id = r.request_id;
  const open = r.status === "open";
  const quoteRows = quotes.map(q => {
    const live = open && q.quote_id === r.current_quote_id && q.status === "pending";
    return `<tr>
      <td class="mono">${q.quote_id.slice(0, 8)}</td><td>$${q.price}</td><td>${badge(q.status)}</td>
      <td>expires ${time(q.expiry_time)}</td>
      <td>${live ? ["accept_quote", "reject_quote", "request_quote_revision"].map(c =>
        `<button onclick="respond('${c}', '${id}', '${q.quote_id}')">${c.replace(/_/g, " ").replace(" quote", "")}</button>`).join("") : ""}</td>
    </tr>`;
  }).join("");
  const eventRows = events.map(e => `<tr>
      <td>${time(e.created_at)}</td><td>${e.event_type}</td><td>${e.created_by ?? "anonymous"}</td>
      <td class="mono">${Object.entries(e).filter(([k]) => !["id", "request_id", "event_type", "created_at", "created_by"].includes(k))
        .map(([k, v]) => `${k}=${v}`).join(" ")}</td></tr>`).join("");
  return `<div class="card">
    <h2>${badge(r.status)} ${r.contact_name} — ${r.pickup_address.suburb} → ${r.dropoff_address.suburb}
      <span class="mono">${id}</span></h2>
    <div class="mono">customer ${r.customer_id ?? "anonymous"}${r.logged_by ? `, logged by ${r.logged_by}` : ""}
      · ${r.parcels.map(p => `${p.quantity}× ${p.size} ${p.weight_kg}kg`).join(", ")}</div>
    ${open ? `<div class="row" style="max-width:420px; align-items:end">
      <input id="price-${id}" value="50" placeholder="price">
      <button onclick="issueQuote('${id}')">Issue quote</button>
      <button onclick="call('cancel_request', {request_id: '${id}', by: $('customer').value})">Cancel request</button>
    </div>` : ""}
    ${quotes.length ? `<table><tr><th>quote</th><th>price</th><th>status</th><th></th><th></th></tr>${quoteRows}</table>` : ""}
    <details><summary>history (${events.length})</summary><table>${eventRows}</table></details>
  </div>`;
}

async function refresh() {
  const requests = await (await fetch("/api/requests")).json();
  $("requests").innerHTML = requests.map(render).join("") || "<section>No requests yet.</section>";
}

refresh();
</script>
</body>
</html>
